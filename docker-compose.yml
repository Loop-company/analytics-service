services:
  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analytics-service
    env_file:
      - .env
    ports:
      - "${GRPC_PORT:-50053}:50053"
    depends_on:
      analytics-postgres:
        condition: service_healthy
    networks:
      - backend-network

  analytics-postgres:
    image: postgres:16-alpine
    container_name: analytics-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytics}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - analytics-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analytics} -d ${POSTGRES_DB:-analytics}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-network

volumes:
  analytics-postgres-data:

networks:
  backend-network:
    external: true
